name = "benefactor-click-tracker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Bind the whole go.benefactor.cc hostname to this Worker as a Cloudflare custom
# domain. `wrangler deploy` provisions the proxied DNS record automatically (the
# benefactor.cc zone is already on Cloudflare) — no manual DNS step.
routes = [
  { pattern = "go.benefactor.cc", custom_domain = true }
]

[vars]
REDIRECT_URL = "https://benefactor.cc/team"
SUPABASE_CLICKS_TABLE = "benefactor_outreach_clicks"
# Postgres schema the clicks table lives in (sent as Content-Profile). Must be in
# the Supabase project's Exposed schemas (PGRST_DB_SCHEMAS=public,benefactor-cc).
SUPABASE_DB_SCHEMA = "benefactor-cc"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put BENEFACTOR_TRACKING_SECRET
#   wrangler secret put BENEFACTOR_TRACKING_PREVIOUS_SECRET  # planned rollover only
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_PUBLISHABLE_KEY
#   wrangler secret put SUPABASE_CLICK_WRITER_TOKEN
