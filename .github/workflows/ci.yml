name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benefactor-source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-vulnerable-dependencies:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-622-source-site-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the source PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate the lockfile with patched versions
        run: npm install --save-exact astro@7.1.0 sharp@0.35.3

      - name: Require a clean production audit
        run: npm audit --omit=dev

      - name: Run click-tracker tests
        run: npm test

      - name: Build the canonical Astro site
        run: npm run build

      - name: Commit the audited dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name benefactor-dependency-bot
          git config user.email benefactor-dependency-bot@users.noreply.github.com
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency files already match the requested patched versions.'
            exit 0
          fi
          git commit -m 'fix: upgrade Astro and Sharp past audited advisories'
          git push origin HEAD:${GITHUB_HEAD_REF}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run click-tracker tests
        run: npm test

      - name: Build canonical Astro site
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Report production dependency vulnerabilities
        run: npm audit --omit=dev
