name: Temporary growth lockfile repair preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'growth/diagnostic-funnel-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate lockfile using npm (no hand-authored integrity values)
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          test -z "$(git diff -- package.json)"
          npm ci --ignore-scripts
          npm audit --omit=dev
      - name: Emit generated lockfile for exact source review
        run: |
          set -euo pipefail
          printf 'LOCK_BEGIN\n'
          base64 -w0 package-lock.json
          printf '\nLOCK_END\n'
