name: refresh vulnerable production dependencies

on:
  push:
    branches: [agent/den-622-source-site-ci]
    paths:
      - .github/workflows/refresh-vulnerable-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benefactor-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-622-source-site-ci
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate the lockfile with patched versions
        run: npm install --save-exact astro@7.1.0 sharp@0.35.3

      - name: Require a clean production audit
        run: npm audit --omit=dev

      - name: Run click-tracker tests
        run: npm test

      - name: Build the canonical Astro site
        run: npm run build

      - name: Commit the reviewed dependency refresh to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name benefactor-dependency-bot
          git config user.email benefactor-dependency-bot@users.noreply.github.com
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency files already match the requested patched versions.'
            exit 0
          fi
          git commit -m 'fix: upgrade Astro and Sharp past audited advisories'
          git push origin HEAD:agent/den-622-source-site-ci
