name: Frontend CI / production deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benefactor-frontend-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build Astro site
        env:
          CUSTOM_DOMAIN: benefactor.cc
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          release_date="$(TZ=America/New_York date +%Y-%m-%d)"
          export PUBLIC_BENEFACTOR_GIT_SHA="$GITHUB_SHA"
          export PUBLIC_BENEFACTOR_RELEASE_DATE="$release_date"
          export PUBLIC_BENEFACTOR_CALVER="${release_date//-/.}"
          npm run build

      - name: Validate the production artifact
        run: |
          set -euo pipefail
          grep -q '^benefactor\.cc$' dist/CNAME
          test -f dist/.nojekyll
          grep -q '/_astro/' dist/index.html
          grep -q 'version ' dist/index.html
          grep -q 'commit ' dist/index.html
          grep -q "$GITHUB_SHA" dist/index.html
          if grep -q '/benefactor\.cc/_astro/' dist/index.html; then
            echo 'Production build contains the GitHub project-pages base path.' >&2
            exit 1
          fi

      # Keep this after functional validation so an advisory never hides test or
      # build regressions. It remains blocking, so vulnerable main cannot deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Checkout the generated production repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: benefactor-cc/benefactor-cc.github.io
          ref: main
          token: ${{ secrets.BENEFACTOR_PAGES_TOKEN }}
          path: tmp/production
          persist-credentials: true

      - name: Publish benefactor.cc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git dist/ tmp/production/
          git -C tmp/production config user.name benefactor-release-bot
          git -C tmp/production config user.email benefactor-release-bot@users.noreply.github.com
          git -C tmp/production add -A
          if git -C tmp/production diff --cached --quiet; then
            echo 'Production already matches this build.'
            exit 0
          fi
          git -C tmp/production commit -m "deploy: publish ${GITHUB_SHA::12}"
          git -C tmp/production push origin HEAD:main

      - name: Smoke test live benefactor.cc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          url="https://benefactor.cc/internal/?deploy=${GITHUB_SHA}"
          body="$(mktemp)"
          expected_calver="$(TZ=America/New_York date +%Y.%m.%d)"
          trap 'rm -f "$body"' EXIT

          for attempt in $(seq 1 24); do
            echo "Live smoke attempt ${attempt}/24: ${url}"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$url" -o "$body" \
              && grep -q 'id="open-workspace-tabs"' "$body" \
              && grep -q 'https://www.instagram.com/benefactor_cc/' "$body" \
              && grep -q 'https://chatgpt.com/' "$body" \
              && grep -q 'version ' "$body" \
              && grep -q 'commit ' "$body" \
              && grep -q "$GITHUB_SHA" "$body" \
              && grep -q "\"calver\":\"${expected_calver}\"" "$body"; then
              echo "Live production smoke test passed for ${GITHUB_SHA} / ${expected_calver}."
              exit 0
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done

          echo 'Live production smoke test failed after deployment.' >&2
          echo 'Expected /internal launcher plus exact release SHA/CalVer were not all present.' >&2
          exit 1
