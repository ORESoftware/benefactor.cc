name: Frontend CI / production artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benefactor-frontend-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build Astro site
        env:
          CUSTOM_DOMAIN: benefactor.cc
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          release_date="$(TZ=America/New_York date +%Y-%m-%d)"
          export PUBLIC_BENEFACTOR_GIT_SHA="$GITHUB_SHA"
          export PUBLIC_BENEFACTOR_RELEASE_DATE="$release_date"
          export PUBLIC_BENEFACTOR_CALVER="${release_date//-/.}"
          npm run build

      - name: Validate the production artifact
        run: |
          set -euo pipefail
          grep -q '^benefactor\.cc$' dist/CNAME
          test -f dist/.nojekyll
          grep -q '/_astro/' dist/index.html
          grep -q 'version ' dist/index.html
          grep -q 'commit ' dist/index.html
          grep -q "$GITHUB_SHA" dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -Fq 'Sitemap: https://benefactor.cc/sitemap.xml' dist/robots.txt
          grep -Fq '<loc>https://benefactor.cc/</loc>' dist/sitemap.xml
          grep -Fq '<loc>https://benefactor.cc/blogs/</loc>' dist/sitemap.xml
          grep -Fq '<loc>https://benefactor.cc/blogs/dentists-local-seo-case-study/</loc>' dist/sitemap.xml
          grep -Fq '<loc>https://benefactor.cc/c/usa/s/legal/</loc>' dist/sitemap.xml
          if grep -Eq '<loc>https://benefactor.cc/(internal|unsubscribe)/' dist/sitemap.xml; then
            echo 'Sitemap exposes an internal or noindex utility page.' >&2
            exit 1
          fi
          if grep -q 'oresoftware.github.io' dist/sitemap.xml; then
            echo 'Sitemap contains the stale GitHub project Pages host.' >&2
            exit 1
          fi
          if grep -q '/benefactor\.cc/_astro/' dist/index.html; then
            echo 'Production build contains the GitHub project-pages base path.' >&2
            exit 1
          fi

      # Keep this after functional validation so an advisory never hides test or
      # build regressions. It remains blocking, so vulnerable main cannot deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify sitemap-to-page parity
        run: node --test tests/site-discovery.buildcheck.mjs

      # Production publication is exclusively handled by
      # benefactor-cc/benefactor-cc.github.io/.github/workflows/sync-public-source.yml.
      # Its own GITHUB_TOKEN is scoped to that repository; no cross-repo PAT
      # is required to read the public Astro source or publish Pages.
